# Phase 1 — image pipeline CI (FR-04: pre-build in CI, push to registry with
# immutable tags; FR-16/§5: BuildKit layer cache; publish gated by ci/smoke.sh).
name: images

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'compose/**'
      - 'ci/**'
      - '.github/workflows/images.yml'
  pull_request:
    paths:
      - 'images/**'
      - 'compose/**'
      - 'ci/**'
      - '.github/workflows/images.yml'
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/platform   # FR-04 target registry
  VERSION: ${{ github.sha }}                                  # immutable tag (FR-04)

jobs:
  build-smoke-publish:
    runs-on: ubuntu-24.04          # matches PRD §11 reference host OS family
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Report Docker/Compose versions
        run: docker version && docker compose version

      - name: Log in to GHCR (publish runs only on main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BuildKit cache via a local buildx cache exporter kept between runs —
      # satisfies "images build in CI with BuildKit cache" (Phase 1 exit criterion)
      # and the ≤5 min cold-build KPI once warm (§5).
      - name: Build base + target + all bundles
        run: |
          chmod +x images/build.sh ci/smoke.sh
          ./images/build.sh all            # PUSH unset here: gate first, publish after smoke

      - name: Smoke gates (size / tools / FR-18 idle set / FR-07 health / NFR-03 / NFR-08 parity)
        run: ./ci/smoke.sh                 # non-zero exit blocks publish (FR-04 integrity)

      - name: Publish with immutable tags (only after gates pass)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for i in base target web-exploitation network-recon password-attacks; do
            docker tag "$REGISTRY/$i:phase1" "$REGISTRY/$i:$VERSION" 2>/dev/null || true
            # rebuild-tag path: build.sh already tagged with $VERSION when env set;
            # fall back to retagging locally-built names for the runner env.
            docker push "$REGISTRY/$i:$VERSION" || {
              docker tag "platform/$i:$VERSION" "$REGISTRY/$i:$VERSION"
              docker push "$REGISTRY/$i:$VERSION"
            }
          done

      # FR-14 — scheduled prune as part of the CI publish step: keep runner
      # disk bounded under the registry-pull pattern. Retention policy is
      # documented in orchestrator/prune.sh's header (keep newest 3 tags per
      # family, 48h dangling grace, 168h build-cache age). On session hosts
      # the same script runs from cron (`./orchestrator/prune.sh --install-cron`
      # prints the line); DRY_RUN=1 makes it report-only.
      - name: Disk hygiene — dangling images + build cache prune (FR-14)
        if: always()
        run: |
          chmod +x orchestrator/prune.sh
          ./orchestrator/prune.sh

      - name: Build timing summary
        when: always()
        run: |
          echo "::notice::Image pipeline run complete. Cold-build budget per §5: <=300s/image with cache."
